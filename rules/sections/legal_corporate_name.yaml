module: legal_information
section: Legal Corporate Name
code: legal_corporate_name
fields:
  - code: company_name
    type: text
    required: true
  - code: tax_document
    type: file
    required: false

status_rules:
  - when: any_required_missing
    result: "Pending Completion"
  - when: any_required_incorrect
    result: "Requires Correction"
  - when: any_required_pending_verification
    result: "Pending Verification"
  - when: all_required_correct
    result: "Verified"



